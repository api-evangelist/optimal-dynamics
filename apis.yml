name: Optimal Dynamics
description: 'Optimal Dynamics is the Decision Company for trucking. Its Transportation
  Decision System (TDS), CORE.ai, applies Artificial Decision Intelligence — born from
  40 years of research at Princeton University — to automate and optimize strategic,
  tactical, and real-time planning for enterprise truckload carriers. The platform
  spans dispatch management, network management, bid analysis, and network simulation,
  using dynamic forecasting to simulate downstream impacts and drive highly automated
  operations that increase revenue per truck and reduce manual planning. Surfaced as
  a portfolio company of bessemer-venture-partners.'
